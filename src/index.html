<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="hiaudio">
    <title>Hi-Audio Latency Test POC Demo</title>
</head>

<body>
    <main id="app">
        <div id="connect-section">
            <button id="connect-btn">Connect Audio</button>
            <p id="connect-status"></p>
        </div>
        <div id="test-section" style="display:none">
            <label>Capture mode:
                <select id="mode-select">
                    <option value="mediarecorder" selected>MediaRecorder</option>
                    <option value="audioworklet">AudioWorklet</option>
                </select>
            </label>
            <label>Number of runs:
                <input type="number" id="run-count" value="1" min="1" max="20">
            </label>
            <latency-test id="tester"></latency-test>
            <button id="start-btn">TEST LATENCY</button>
            <div id="results"></div>
            <div id="aggregate" style="display:none"></div>
        </div>
    </main>
    <script type="module" src="scripts/index.js"></script>
</body>

</html>
